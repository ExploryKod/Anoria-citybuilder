<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Anoria — Status icon placement tool</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #111; color: #eee; }
        #viewport { position: absolute; inset: 0; }
        #panel {
            position: absolute; top: 0; right: 0; width: 320px; height: 100%;
            background: rgba(20, 20, 30, 0.92); padding: 16px; box-sizing: border-box;
            overflow-y: auto; font-size: 13px;
        }
        #panel h1 { font-size: 15px; margin: 0 0 12px; }
        #panel label { display: block; margin-top: 10px; margin-bottom: 2px; opacity: 0.8; }
        #panel select, #panel input[type="number"] { width: 100%; box-sizing: border-box; padding: 4px; }
        .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        #panel input[type="checkbox"] { margin-right: 6px; }
        #output {
            margin-top: 14px; background: #000; color: #7fffab; padding: 8px;
            font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all;
            border-radius: 4px; max-height: 160px; overflow-y: auto;
        }
        #hint { margin-top: 10px; opacity: 0.7; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="panel">
        <h1>Status icon placement tool</h1>

        <label for="building-select">Building</label>
        <select id="building-select"></select>

        <label for="icon-select">Icon</label>
        <select id="icon-select"></select>

        <label>Offset (fraction of bounding box)</label>
        <div class="row3">
            <input id="offset-x" type="number" step="0.05" title="x">
            <input id="offset-y" type="number" step="0.05" title="y">
            <input id="offset-z" type="number" step="0.05" title="z">
        </div>

        <label>Scale</label>
        <div class="row3">
            <input id="scale-x" type="number" step="0.05" title="x">
            <input id="scale-y" type="number" step="0.05" title="y">
            <input id="scale-z" type="number" step="0.05" title="z">
        </div>

        <label style="margin-top: 14px;">
            <input id="show-box" type="checkbox" checked>
            Show local bounding box
        </label>

        <div id="output"></div>
        <div id="hint">
            Drag with the mouse to orbit, scroll to zoom. Adjust the offset until the
            icon sits where you want on this building, then copy the JSON above into
            <code>StatusIconAnchorCatalog.js</code> under this building's id.
        </div>
    </div>
    <script type="module" src="/src/presentation/pages/placement/main.js"></script>
</body>
</html>
