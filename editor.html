<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#fb8122" />
    <title>Urbanicompta — Éditeur</title>
    <link rel="stylesheet" href="/src/presentation/pages/missions/missions.css">
</head>
<body>
    <main class="site-page editor-menu-page">
        <header class="site-header">
            <a href="/" class="site-back" aria-label="Retour au menu principal" title="Menu principal"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
            <h1>Éditeur</h1>
        </header>

        <section class="editor-menu" aria-label="Ouvrir l'éditeur">
            <button type="button" id="editor-menu-blank" class="site-btn site-btn--primary">Carte vierge</button>

            <label class="site-btn">
                Charger un fichier (.json)
                <input type="file" id="editor-menu-file" accept="application/json,.json" hidden>
            </label>

            <p class="site-section-title">Cartes enregistrées</p>
            <ul id="editor-menu-maps" class="mission-modal-list" aria-label="Cartes enregistrées"></ul>

            <p id="editor-menu-status" class="mission-my-map-upload-status" role="alert" hidden></p>
        </section>
    </main>

    <script type="module" src="/src/presentation/pages/editor-menu/main.js"></script>
</body>
</html>
