<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#fb8122" />
    <title>Eraanurbs — Carte du monde</title>
    <link rel="stylesheet" href="/src/presentation/pages/world/world.css">
    <link rel="stylesheet" href="/src/presentation/dom/styles/cheat-code-prompt.css">
</head>
<body class="map-page">
    <header class="site-header map-page-header" id="world-map-header">
        <a
            href="/"
            class="map-page-exit-btn"
            title="Retour à l'accueil"
            aria-label="Retour à l'accueil"
        >
            <span class="map-page-exit-btn__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-door-open">
                    <path d="M11 20H2"/>
                    <path d="M11 4.562v16.157a1 1 0 0 0 1.242.97L19 20V5.562a2 2 0 0 0-1.515-1.94l-4-1A2 2 0 0 0 11 4.561z"/>
                    <path d="M11 4H8a2 2 0 0 0-2 2v14"/>
                    <path d="M14 12h.01"/>
                    <path d="M22 20h-3"/>
                </svg>
            </span>
        </a>
        <a
            href="/game"
            class="map-page-exit-btn"
            title="Retour à la ville"
            aria-label="Retour à la ville"
        >
            <span class="map-page-exit-btn__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                    <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
            </span>
        </a>
        <div class="map-page-header__lead">
            <h1>Carte du monde</h1>
            <p id="world-map-stats" class="map-page-header__stats" aria-live="polite"></p>
        </div>
    </header>

    <main id="map-root" class="site-page map-page-layout" aria-label="Carte hexagonale du monde"></main>

    <div id="city-exchange-overlay" class="city-exchange-overlay" role="dialog" aria-modal="true" aria-labelledby="city-exchange-title" aria-hidden="true" inert>
        <div class="city-exchange-backdrop" aria-hidden="true"></div>
        <div class="city-exchange-panel">
            <header class="city-exchange__header">
                <h2 id="city-exchange-title">Échanges</h2>
                <button type="button" class="panel-close-btn" id="city-exchange-close-btn" title="Fermer" aria-label="Fermer les échanges">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-x" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="m15 9-6 6"/>
                        <path d="m9 9 6 6"/>
                    </svg>
                </button>
            </header>
            <div class="city-exchange__tabs" role="tablist" aria-label="Sections des échanges">
                <button type="button" role="tab" id="city-exchange-tab-commerce" data-tab="commerce" aria-controls="city-exchange-panel-commerce" aria-selected="true" tabindex="0">💰 Commerce</button>
                <button type="button" role="tab" id="city-exchange-tab-culture" data-tab="culture" aria-controls="city-exchange-panel-culture" aria-selected="false" tabindex="-1">🏛 Culture</button>
            </div>
            <div class="city-exchange__body">
                <div id="city-exchange-panel-commerce" role="tabpanel" class="city-exchange__tabpanel is-active" aria-labelledby="city-exchange-tab-commerce" tabindex="0"></div>
                <div id="city-exchange-panel-culture" role="tabpanel" class="city-exchange__tabpanel" aria-labelledby="city-exchange-tab-culture" tabindex="0"></div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/presentation/pages/world/main.js"></script>
<div id="cheat-code-prompt" class="cheat-code-prompt" hidden aria-hidden="true" inert>
    <form id="cheat-code-form" autocomplete="off">
        <input
            id="cheat-code-input"
            name="cheat-code"
            type="text"
            inputmode="text"
            spellcheck="false"
            aria-label="Code triche"
            placeholder="Code…"
        >
        <button id="cheat-code-submit" type="submit">OK</button>
    </form>
    <p id="cheat-code-feedback" hidden></p>
</div>

</body>
</html>
