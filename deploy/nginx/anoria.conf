# The page routes and caching of the site. THIS FILE IS NOT THE ONE THE SERVER RUNS: the server's own copy (/etc/nginx/sites-enabled/anoria) also holds the HTTPS lines
# Certbot wrote into it (the `listen 443 ssl`, `ssl_certificate`, `ssl_certificate_key`, `options-ssl-nginx.conf` and `ssl_dhparam` lines, each marked "managed by
# Certbot"), which this file does not have. Never copy it over the server's: that would erase the certificates' configuration and take the HTTPS down.
# A change here (a new page route, a header) is applied on the server by inserting the changed lines into its copy, then `sudo nginx -t && sudo systemctl reload nginx`;
# `deploy/deploy.sh` publishes only the built site (`dist/`), never this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name urbanicompta.fr www.urbanicompta.fr _;

    root /var/www/anoria/current;
    index index.html;

    include mime.types;
    types { model/gltf-binary glb; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm text/plain;

    # The pages (the rewrites of vercel.json)
    location = /game                { rewrite ^ /game.html last; }
    location ~ ^/game/[^/]+$        { rewrite ^ /game.html last; }
    location = /hamlets             { rewrite ^ /hamlets.html last; }
    location = /world               { rewrite ^ /world.html last; }
    location = /missions            { rewrite ^ /missions.html last; }
    location = /editor              { rewrite ^ /editor.html last; }
    location = /settings            { rewrite ^ /settings.html last; }
    location = /privacy             { rewrite ^ /privacy.html last; }
    location = /terms               { rewrite ^ /terms.html last; }
    location = /legal               { rewrite ^ /legal.html last; }
    location = /credits             { rewrite ^ /credits.html last; }
    location = /assets              { rewrite ^ /assets.html last; }

    # Vite's hashed files: never modified once built
    location /assets/ {
        include snippets/anoria-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML and service worker: always revalidated, so a new version is seen
    location ~* \.html$ {
        include snippets/anoria-security.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~* /(sw|pwabuilder-sw|registerSW)\.js$ {
        include snippets/anoria-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include snippets/anoria-security.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }
}
