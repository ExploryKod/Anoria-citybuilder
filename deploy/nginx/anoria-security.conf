add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob: https://github.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: https://github.com; worker-src 'self' blob: https://storage.googleapis.com; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
